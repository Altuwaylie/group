*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,Tahoma;background:linear-gradient(140deg,#fff3d6,#ffe0f0,#dff3ff);min-height:100vh;color:#00695c}h1{text-align:center;color:#d65191}button,input,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:13px;padding:10px 14px;background:#26a69a;color:white;font-weight:700;touch-action:manipulation}button:disabled{opacity:.65;cursor:default}input,textarea{width:100%;padding:12px;border:2px solid #a8d9d4;border-radius:13px}textarea{min-height:140px}.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}.panel{background:#ffffffcb;border:2px solid white;border-radius:22px;padding:13px;margin-bottom:14px}.board-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 18px}.board{display:flex;flex-wrap:nowrap;gap:10px;width:100%;min-width:100%;align-items:flex-start}.team{flex:1 0 0;min-width:180px;background:#ffffffcb;border:2px solid white;border-radius:22px;padding:10px;box-shadow:0 8px 25px #1231}.candidate{width:100%;min-height:90px;background:linear-gradient(120deg,#ffffffaa,#d9f3f4aa);backdrop-filter:blur(18px);border:2px solid #63bcb4;color:#075f59;font-size:22px;overflow-wrap:anywhere}.winner{background:#dceddb}.head{display:flex;gap:5px;background:#26a69a;border-radius:14px;padding:5px;margin-top:10px}.title{flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 4px}.pen{background:#ffffff33;padding:6px 8px}.progress{text-align:center;background:#e0f2f1;border:2px solid #64bab2;border-radius:13px;padding:12px;margin:8px 0;font-weight:800}.student{width:100%;margin:4px 0;background:#e0f2f1;border:2px solid #26a69a;color:#00695c;overflow-wrap:anywhere}.used{background:#cfd8dc;color:#546e7a;border-color:#90a4ae}.excluded{background:#ffebee;border-color:#ef8b8b;color:#a33;text-decoration:line-through}.active,.target{outline:3px solid #ffbf28;outline-offset:2px}.purple{background:#7e57c2}.red{background:#e55353}.gray{backgro </style><h1>المجموعه</h1><div class="panel"><div id="classes" class="classes"></div><div class="bar"><button id="newClass">فصل جديد</button><button id="editClass" class="gray">تعديل الفصل</button><button id="sound" class="gray">🔊</button></div></div><div class="bar"><button id="playTab">الفرق</button><button id="resultsTab" class="purple">النتائج</button></div><section id="playPage"><div class="bar"><button id="pick">اختيار عشوائي</button><button id="restore" class="purple">إعادة ظهور كل الأسماء</button><button id="shuffle" class="purple">⇄ تبديل الفرق</button></div><div class="panel"><input id="studentInput" placeholder="اسم الطالب"><div class="bar"><button id="addStudent">إضافة</button><button id="importStudents" class="gray">إضافة أسماء دفعة واحدة</button><button id="addTeam">إضافة فريق</button></div><div id="pool" class="pool"></div></div><div id="actionBar" class="action" hidden><span id="actionText"></span><button id="cancelAction" class="gray">إلغاء</button></div><div id="warning" class="notice" hidden></div><div class="board-wrap"><div id="board" class="board"></div></div></section><section id="resultsPage" class="panel" hidden><h2>ترتيب الفرق — التقدم</h2><div id="teamResults" class="scroll"></div><h2>الأبطال — أفضل 5</h2><div id="heroResults" class="scroll"></div><h2>الشغب</h2><div id="behaviorResults" class="scroll"></div></section><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="bar"><button id="modalSave">حفظ</button><button id="modalCancel" class="gray">إلغاء</button></div></dialog><div id="toast" class="toast" hidden></div><script>
'use strict';const $=id=>document.getElementById(id),KEY='heroes_board_fixed_20';const uid=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={classes:[],current:null,sound:true};try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.classes))state=s}catch(e){}let selected=[],menu=null,action=null,page='play',timer,handler=null,ac;const cls=()=>state.classes.find(c=>c.id===state.current),student=(c,id)=>c.students.find(s=>s.id===id),team=(c,id)=>c.teams.find(t=>t.id===id);const teamNew=name=>({id:uid(),name,progress:0,members:[],used:[],captain:null,candidate:null});const classNew=name=>({id:uid(),name,students:[],teams:Array.from({length:5},(_,i)=>teamNew('فريق '+(i+1))),round:null});if(!state.classes.length){const c=classNew('الفصل الأول');state.classes.push(c);state.current=c.id}if(!cls())state.current=state.classes[0].id;
function toast(t){clearTimeout(timer);$('toast').textContent=t;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,3500)}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('تعذر الحفظ المحلي')}}function sound(k){if(!state.sound)return;try{ac||=new(window.AudioContext||window.webkitAudioContext)();ac.resume();(k==='bad'?[220,165]:[660,880]).forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.11;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.18)})}catch(e){}}
function eligible(c,t){return t.members.filter(id=>student(c,id)&&!student(c,id).excluded)}function resetCompleted(c){let names=[];c.teams.forEach(t=>{let ids=eligible(c,t);if(ids.length&&ids.every(id=>t.used.includes(id))){t.used=[];names.push(t.name)}});return names}function captains(c){c.teams.forEach(t=>{let members=t.members.map(id=>student(c,id)).filter(Boolean),cap=members.find(s=>s.id===t.captain)||members[0];members.forEach(s=>{if(s.points>cap.points)cap=s});t.captain=cap?cap.id:null})}function clearRound(c){c.round=null;c.teams.forEach(t=>t.candidate=null)}function clearActions(){action=null;menu=null;selected=[]}
function modal(title,body,fn){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;handler=fn;$('modalSave').hidden=!fn;if(!$('modal').open)$('modal').showModal()}function close(){$('modal').close();handler=null}$('modalCancel').onclick=close;$('modalSave').onclick=()=>{let fn=handler;if(fn&&fn()!==false)close()};function textEdit(title,value,fn){modal(title,'<input id="editValue" value="'+esc(value)+'">',()=>{let v=$('editValue').value.trim();if(!v)return false;fn(v)})}function button(label,fn,css=''){let b=document.createElement('button');b.textContent=label;b.className=css;b.onclick=fn;return b}
function pick(){let c=cls();if(action)return toast('أوقف وضع العقوبة أو النقل أولًا');if(c.round&&!c.round.resolved)return toast('حدد الفائز في الجولة الحالية أولًا');clearRound(c);resetCompleted(c);let candidates=[];c.teams.forEach(t=>{let ids=eligible(c,t).filter(id=>!t.used.includes(id));if(ids.length){let id=ids[Math.floor(Math.random()*ids.length)];t.candidate=id;candidates.push({teamId:t.id,studentId:id})}});if(!candidates.length){render();return toast('لا توجد أسماء متاحة')};c.round={candidates,resolved:false,winner:null};sound();save();render()}
function win(id){let c=cls(),r=c.round;if(action||!r||r.resolved)return;let item=r.candidates.find(x=>x.teamId===id);if(!item)return;let t=team(c,id),s=student(c,item.studentId);if(!t||!s)return;r.resolved=true;r.winner=s.id;s.points++;t.progress+=3;r.candidates.forEach(x=>{let tt=team(c,x.teamId);if(tt&&!tt.used.includes(x.studentId))tt.used.push(x.studentId)});captains(c);let restarted=resetCompleted(c);sound();save();render();toast(s.name+': +1 نقطة، '+t.name+': +3 تقدم'+(restarted.length?' — تجددت دورة: '+restarted.join('، '):''))}
function punish(t,s){s.strikes++;t.progress=Math.max(0,t.progress-1);sound('bad');save();render();if(s.strikes>=s.limit)modal('تنبيه سلوك','<p>'+esc(s.name)+'</p><p>المخالفات: '+s.strikes+' / '+s.limit+'</p><p>يرجى اتخاذ الإجراء المناسب.</p>',null);else toast(s.name+': مخالفة سلوك، وخصم 1 من تقدم الفريق')}
function clickStudent(tid,sid){let c=cls(),t=team(c,tid),s=student(c,sid);if(!t||!s)return;if(action){if(action.teamId!==tid)return;if(action.type==='punish')return punish(t,s);action.studentId=sid;render();return}s.excluded=!s.excluded;clearRound(c);resetCompleted(c);save();render()}
function clickTeam(id){let c=cls(),target=team(c,id);if(!target)return;if(action&&action.type==='transfer'&&action.studentId){let source=team(c,action.teamId),sid=action.studentId;if(!source||source.id===id)return;source.members=source.members.filter(x=>x!==sid);source.used=source.used.filter(x=>x!==sid);if(!target.members.includes(sid))target.members.push(sid);clearRound(c);clearActions();captains(c);resetCompleted(c);save();render();return}if(action||!selected.length)return;selected.forEach(sid=>{c.teams.forEach(t=>{t.members=t.members.filter(x=>x!==sid);t.used=t.used.filter(x=>x!==sid)});target.members.push(sid)});selected=[];clearRound(c);captains(c);resetCompleted(c);save();render()}
function deleteTeam(id){let c=cls(),t=team(c,id);if(!t)return;if(!confirm('حذف الفريق «'+t.name+'»؟ سيحذف تقدمه وتعود أسماؤه إلى قائمة الطلاب مع الاحتفاظ بنقاطهم ومخالفاتهم.'))return;c.teams=c.teams.filter(x=>x.id!==id);clearRound(c);clearActions();save();render()}
function editClass(){let c=cls();modal('تعديل الفصل','<div id="classOptions" class="bar"></div>',null);$('classOptions').append(button('تغيير اسم الفصل',()=>textEdit('اسم الفصل',c.name,v=>{c.name=v;save();render()})),button('حذف الفصل',()=>{if(!confirm('حذف الفصل «'+c.name+'» نهائيًا مع جميع طلابه وفرقه ونقاطه؟'))return;state.classes=state.classes.filter(x=>x.id!==c.id);if(!state.classes.length)state.classes.push(classNew('الفصل الأول'));state.current=state.classes[0].id;clearActions();close();save();render()},'red'))}
function addNames(raw){let c=cls();raw.split(/[\n،,]+/).map(x=>x.trim()).filter(Boolean).forEach(name=>c.students.push({id:uid(),name,points:0,strikes:0,limit:3,excluded:false}));save();render()}
function changeTeams(mode){const c=cls();if(mode==='random'&&!c.teams.length)return toast('أضف فريقًا أولًا');const message=mode==='random'?'تأكيد التبديل العشوائي؟ سيعاد توزيع الطلاب وتصفير نقاط الإجابات ومخالفات السلوك وتقدم الفرق.':'تأكيد عودة الأسماء؟ سيعود جميع الطلاب إلى القائمة العلوية للتوزيع اليدوي، مع تصفير نقاط الإجابات ومخالفات السلوك وتقدم الفرق.';if(!confirm(message))return;const ids=c.students.map(s=>s.id);if(mode==='random')for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}c.teams.forEach(t=>{t.members=[];t.used=[];t.progress=0;t.captain=null});c.students.forEach(s=>{s.points=0;s.strikes=0;s.excluded=false});if(mode==='random')ids.forEach((id,i)=>c.teams[i%c.teams.length].members.push(id));clearRound(c);clearActions();captains(c);close();save();render();toast(mode==='random'?'تم توزيع الطلاب عشوائيًا':'عادت الأسماء إلى القائمة للتوزيع اليدوي')}
function teamsMenu(){modal('تبديل الفرق','<div id="teamsOptions" class="bar"></div>',null);$('teamsOptions').append(button('⇄ تبديل عشوائي',()=>changeTeams('random'),'purple'),button('↩︎ عودة الأسماء',()=>changeTeams('manual')))}
function results(){let c=cls(),table=(head,rows)=>'<table><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+rows+'</table>';$('teamResults').innerHTML=table(['#','الفريق','التقدم'],[...c.teams].sort((a,b)=>b.progress-a.progress).map((t,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(t.name)+'</td><td>'+t.progress+'</td></tr>').join(''));$('heroResults').innerHTML=table(['#','الطالب','الإجابات'],[...c.students].filter(s=>s.points>0).sort((a,b)=>b.points-a.points).slice(0,5).map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+s.points+'</td></tr>').join(''));$('behaviorResults').innerHTML=table(['الطالب','المخالفات','حد التذكير'],[...c.students].sort((a,b)=>b.strikes-a.strikes).map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+s.strikes+'</td><td><button data-limit="'+s.id+'">'+s.limit+'</button></td></tr>').join(''));$('behaviorResults').querySelectorAll('[data-limit]').forEach(b=>b.onclick=()=>{let s=student(c,b.dataset.limit);modal('حد التذكير — '+s.name,'<input id="limitInput" type="number" min="1" value="'+s.limit+'">',()=>{let v=Number($('limitInput').value);if(!Number.isInteger(v)||v<1)return false;s.limit=v;save();render()})})}
function render(){let c=cls();captains(c);$('sound').textContent=state.sound?'🔊':'🔇';$('playPage').hidden=page!=='play';$('resultsPage').hidden=page!=='results';$('classes').replaceChildren();state.classes.forEach(x=>$('classes').append(button(x.name,()=>{state.current=x.id;clearActions();save();render()},x.id===c.id?'active':'')));$('pool').replaceChildren();let assigned=new Set(c.teams.flatMap(t=>t.members));c.students.filter(s=>!assigned.has(s.id)).forEach(s=>$('pool').append(button(s.name,()=>{if(action)return;selected=selected.includes(s.id)?selected.filter(x=>x!==s.id):[...selected,s.id];render()},selected.includes(s.id)?'selected':'')));$('actionBar').hidden=!action;if(action)$('actionText').textContent=action.type==='punish'?'⚠️ وضع الشغب نشط':action.studentId?'⇄ اختر اسم الفريق المستقبِل':'⇄ اختر الطالب';let warned=c.students.filter(s=>s.strikes>=s.limit);$('warning').hidden=!warned.length;$('warning').textContent=warned.map(s=>s.name+' ('+s.strikes+')').join('، ');$('board').replaceChildren();c.teams.forEach(t=>{let card=document.createElement('div');card.className='team';let s=student(c,t.candidate),box=button(s?s.name:'—',()=>win(t.id),'candidate'+(c.round&&c.round.winner===t.candidate?' winner':''));box.disabled=!s||!!action||!!c.round?.resolved;card.append(box);let head=document.createElement('div');head.className='head';head.append(button(t.name,()=>clickTeam(t.id),'title'),button('✏️',()=>{menu=menu===t.id?null:t.id;render()},'pen'));card.append(head);if(menu===t.id){let m=document.createElement('div');m.className='bar';m.append(button('⇄',()=>{action={type:'transfer',teamId:t.id,studentId:null};selected=[];render()},'purple'),button('⚠️',()=>{action=action?.type==='punish'&&action.teamId===t.id?null:{type:'punish',teamId:t.id};selected=[];render()},'red'+(action?.type==='punish'&&action.teamId===t.id?' active':'')),button('A',()=>textEdit('اسم الفريق',t.name,v=>{t.name=v;menu=null;save();render()})),button('🗑️ حذف الفريق',()=>deleteTeam(t.id),'red') $('pick').onclick=pick;$('restore').onclick=()=>{let c=cls();c.teams.forEach(t=>t.used=[]);c.students.forEach(s=>s.excluded=false);clearRound(c);clearActions();save();render()};$('cancelAction').onclick=()=>{action=null;render()};$('shuffle').onclick=teamsMenu;$('addStudent').onclick=()=>{let v=$('studentInput').value.trim();if(v){addNames(v);$('studentInput').value=''}};$('studentInput').onkeydown=e=>{if(e.key==='Enter')$('addStudent').click()};$('importStudents').onclick=()=>modal('إضافة أسماء','<textarea id="importInput" placeholder="كل اسم في سطر"></textarea>',()=>{if(!$('importInput').value.trim())return false;addNames($('importInput').value)});$('addTeam').onclick=()=>textEdit('اسم الفريق الجديد','فريق '+(cls().teams.length+1),v=>{cls().teams.push(teamNew(v));clearRound(cls());save();render()});$('newClass').onclick=()=>textEdit('فصل جديد','',v=>{let c=classNew(v);state.classes.push(c);state.current=c.id;clearActions();save();render()});$('editClass').onclick=editClass;$('sound').onclick=()=>{state.sound=!state.sound;save();render()};$('playTab').onclick=()=>{page='play';render()};$('resultsTab').onclick=()=>{page='results';render()};state.classes.forEach(c=>{resetCompleted(c);captains(c)});save();render();</script></html>
